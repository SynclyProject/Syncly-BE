spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: syncly
  profiles:
    default: ${SPRING_PROFILE}
  cache:
    type: redis


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER_NAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    code-ttl-seconds: 180
    verified-ttl-seconds: 600
    invitation:
      link: ${SYNCLY_LINK}
      token-expiration-millis: 604800000 #7일

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "https://api.syncly-io.com/api/login/oauth2/code/google"
            authorization-grant-type: authorization_code
            scope:
              - profile     #이름, 프로필 이미지
              - email       #이메일
        provider:
          google:
            user-name-attribute: sub
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}


auth:
  token:
    issuer: https://syncly-io.com
    hmacSecretBase64: ${JWT_SECRET_KEY} #토큰 서명키
    accessTtlSec: 120000 #20분 배포후 10분으로 변경가능
    refreshTtlSec: 604800 #7일
redis:
  cache:
    member-ttl-seconds: 259200   # 3일

# ==================== Actuator & 모니터링 ====================
# 자동 저장 스케줄러 모니터링을 위한 메트릭 수집 설정
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus  # Prometheus 메트릭 노출
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  metrics:
    enable:
      jvm: true
      process: true
      system: true
      logback: true
    export:
      simple:
        enabled: true
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        note.autosave.duration: true
        note.autosave.save.time: true
        note.manual.save.time: true
    tags:
      application: ${spring.application.name}

logging:
  discord:
    webhook-url: ${DISCORD_ERROR_WEBHOOK_URL:}
    config: classpath:logback-spring.xml

# ==================== 자동 저장 스케줄러 설정 ====================
# 30초마다 실행되는 자동 저장 스케줄러의 타이밍을 조정하려면 여기서 수정
# 단위: milliseconds
scheduler:
  note:
    auto-save:
      fixed-delay: 30000      # 30초마다 실행
      initial-delay: 30000    # 애플리케이션 시작 후 30초 후 첫 실행







